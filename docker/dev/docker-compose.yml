---

services:
  angular-builder:
    image: local/angular-builder
    container_name: angular-builder
    hostname: angular-builder
    # command: "sleep infinity" # default
    # command: "npm install"
    command: "ng serve --host 0.0.0.0 --port 4200 --open --live-reload=true --disable-host-check --public-host http://localhost:4200"
    volumes:
      - ./../..:/var/www
    ports:
      - 4200:4200
      - 49153:49153
